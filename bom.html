<style>
/* Layout: Emdad-family app shell. Purple top bar, tabs, one working panel under it. Same palette as إمداد so the two feel like one system. */
:root{
  --nav:#714B67;--nav-ink:#fff;--nav-hover:rgba(255,255,255,.14);
  --bg:#F4F2F4;--surface:#fff;--ink:#1F2329;--muted:#646B74;--line:#DEDAE0;--soft:#F7F5F7;
  --accent:#714B67;--accent-ink:#fff;--accent-soft:#F1E8EF;--link:#017E84;
  --ok:#1B7A48;--ok-soft:#E3F2E9;--warn:#9A5B00;--warn-soft:#FFF1D6;--bad:#B42318;--bad-soft:#FBE6E3;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --nav:#4E3347;--bg:#17151A;--surface:#211E24;--ink:#ECE8EE;--muted:#A49DA8;--line:#38323C;--soft:#29252D;
  --accent:#C08AB3;--accent-ink:#1A1219;--accent-soft:#3A2B36;--link:#4FC3C8;
  --ok:#5FCB8E;--ok-soft:#1D3327;--warn:#F0B44C;--warn-soft:#3A2D14;--bad:#F2877B;--bad-soft:#3D1F1C;color-scheme:dark}}
:root[data-theme="dark"]{
  --nav:#4E3347;--bg:#17151A;--surface:#211E24;--ink:#ECE8EE;--muted:#A49DA8;--line:#38323C;--soft:#29252D;
  --accent:#C08AB3;--accent-ink:#1A1219;--accent-soft:#3A2B36;--link:#4FC3C8;
  --ok:#5FCB8E;--ok-soft:#1D3327;--warn:#F0B44C;--warn-soft:#3A2D14;--bad:#F2877B;--bad-soft:#3D1F1C;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav)}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.num,th.num{text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--nav);color:var(--nav-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:6px;min-height:48px;flex-wrap:wrap}

input.in,select.in,textarea.in{border:1px solid var(--line);border-radius:4px;padding:7px 9px;background:var(--surface);font-weight:400;width:100%;min-width:0}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

.lvl1 td:first-child{padding-inline-start:28px}

.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:50;max-width:calc(100% - 32px);font-size:13px}

.chips{display:flex;gap:6px;flex-wrap:wrap}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}.search{width:100%}}

.bar-s{flex-basis:100%;height:4px;border-radius:2px;background:linear-gradient(to left,var(--accent) var(--w),var(--soft) var(--w))}
@media (prefers-reduced-motion:no-preference){.btn,.chip,tr.click td{transition:background .12s}}
</style>

<script>
/* BOM app. Data contract is identical to إمداد: collections in one db, read/written only through
   claude.use('db').collection(col).doc(id).set/delete and collection(col).onSnapshot(cb).
   - items: {sku,name,type,unit,cost,onHand,...} with id "IT-<sku>", the same ids Emdad uses.
   - boms:  {code,itemId,version,status,yieldQty,lines:[{itemId,qty,scrap}],notes,hist,...}
   Inside Claude this is the artifact db. Next to Emdad's backend.js it is Emdad's Supabase "docs" table. */
const ITEM_T={raw:'خامات',component:'مكونات',packaging:'تغليف',semi:'نصف مصنّع',finished:'منتج تام',supplies:'مستلزمات وصيانة'};
const ST={draft:'مسودة',approved:'معتمدة',archived:'مؤرشفة'};
const LINKED=window.BOM_LINKED===true; // set by build.ps1 next to Emdad: items and stock belong to Emdad, read-only here
document.getElementById('toEmdad').hidden=!LINKED;
const COLS=LINKED?['items','boms','rfqs']:['items','boms']; // rfqs: Emdad's quote requests, so shortages can open one
const S={items:[],boms:[],rfqs:[]};
let db=null,meId='',mode='local',loaded=new Set(),view={tab:'boms',id:null},q='',fType='',fSt='';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>{const x=parseFloat(String(v??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/,/g,''));return isFinite(x)?x:0};
const fmt=(v,d=2)=>Number(v||0).toLocaleString('en-US',{maximumFractionDigits:d});
const money=v=>fmt(v,2);
const safeId=s=>String(s).trim().replace(/[^A-Za-z0-9_\-.~:@+]/g,'_').slice(0,120)||'x';
const byId=(col,id)=>S[col].find(x=>x.id===id);
const itemLabel=i=>i?`${i.sku||i.id} · ${i.name}`:'';
const now=()=>Date.now();
const genNo=p=>{const d=new Date();return `${p}-${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,'0')}-${Math.random().toString(36).slice(2,6).toUpperCase()}`};

function toast(msg,tone){const t=document.createElement('div');t.className='toast '+(tone||'');t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}

/* ---------- storage ---------- */
function localDb(){ // same surface as the real db, kept in this browser only
  const key='bom-local-v1';let store={};try{store=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}
  const subs={};const save=()=>{try{localStorage.setItem(key,JSON.stringify(store))}catch(e){}};
  const emit=col=>(subs[col]||[]).forEach(cb=>cb({docs:Object.entries(store[col]||{}).map(([id,d])=>({id,data:()=>d}))}));
  return{collection(col){return{
    doc(id){return{async set(d){(store[col]=store[col]||{})[id]=JSON.parse(JSON.stringify(d));save();emit(col)},async delete(){if(store[col])delete store[col][id];save();emit(col)}}},
    onSnapshot(cb){(subs[col]=subs[col]||[]).push(cb);setTimeout(()=>emit(col),0);return()=>{}}
  }}};
}
async function put(col,id,data,act){
  const prev=byId(col,id);const t=now();
  const body=Object.assign({},data,{createdAt:prev?.createdAt||t,createdBy:prev?prev.createdBy||'':meId,updatedAt:t,updatedBy:meId});
  if(act){body.hist=[...(prev?.hist||[]),{a:act,t,u:meId}].slice(-30)}else if(prev?.hist)body.hist=prev.hist;
  delete body.id;
  try{await db.collection(col).doc(id).set(body)}catch(e){toast(e?.code==='invalid_argument'?'مش مسموحلك تعدّل هنا. اطلب صلاحية Contributor.':e?.code==='quota_exceeded'?'المساحة اتملت. امسح سجلات قديمة.':'الحفظ ما تمّش. جرّب تاني.','bad');throw e}
}
async function del(col,id){try{await db.collection(col).doc(id).delete()}catch(e){toast('المسح ما تمّش. جرّب تاني.','bad');throw e}}

/* ---------- BOM math ---------- */
const activeBom=itemId=>{const l=S.boms.filter(b=>b.itemId===itemId&&b.status==='approved');return l.sort((a,b)=>b.version-a.version)[0]||null};
const bomsOf=itemId=>S.boms.filter(b=>b.itemId===itemId).sort((a,b)=>b.version-a.version);
/* units: a line can be written in a different unit than the item is stocked in (recipe in جم, stock in كجم or شيكارة).
   l.conv = how many line units make one stock unit. Weight and volume convert by themselves; anything else the user types once. */
const UNIT_N={'كجم':'كجم','كيلو':'كجم','كيلوجرام':'كجم','كغ':'كجم','kg':'كجم','جم':'جم','جرام':'جم','غرام':'جم','g':'جم','طن':'طن','لتر':'لتر','l':'لتر','مل':'مل','ملي':'مل','مللي':'مل','ml':'مل'};
const UNIT_F={'كجم':['w',1],'جم':['w',0.001],'طن':['w',1000],'لتر':['v',1],'مل':['v',0.001]};
const normU=u=>{const s=String(u||'').trim().replace(/\.$/,'');return UNIT_N[s.toLowerCase()]||s};
const autoConv=(stockU,lineU)=>{const a=normU(stockU),b=normU(lineU);if(!b||a===b)return 1;const fa=UNIT_F[a],fb=UNIT_F[b];return fa&&fb&&fa[0]===fb[0]?fa[1]/fb[1]:null};
const lineConv=l=>{const it=byId('items',l.itemId);if(!it)return 1;return autoConv(it.unit,l.unit)||n(l.conv)||1};
const needsConv=l=>{const it=byId('items',l.itemId);return !!it&&autoConv(it.unit,l.unit)===null};
const lineNeed=l=>n(l.qty)*(1+n(l.scrap)/100)/lineConv(l); // in stock units
/* stages: one product can be dough only, dough + filling, or dough + filling + finish. Each line carries its stage;
   lines saved before stages existed fall back to packing (packaging items) or dough. */
const STAGES=[['dough','العجن والخبز','عجن'],['filling','الحشو','حشو'],['finish','الفينش والتوبنج','فينش'],['pack','التعبئة','تعبئة']];
const lineStage=l=>l.stage||(byId('items',l.itemId)?.type==='packaging'?'pack':'dough');
const prodStages=b=>{const s=new Set((b.lines||[]).filter(l=>l.itemId).map(lineStage));return STAGES.filter(([k])=>k!=='pack'&&s.has(k))};
function bomCost(b,seen=new Set()){ // cost of one batch; semi-finished lines use their own approved BOM's unit cost when they have one
  let total=0;const rows=(b.lines||[]).map(l=>{const it=byId('items',l.itemId);let uc=n(it?.cost);
    const sub=it&&activeBom(it.id);if(sub&&!seen.has(sub.id)){const s2=new Set(seen);s2.add(b.id);uc=bomCost(sub,s2).unit}
    const c=lineNeed(l)*uc;total+=c;return{l,it,uc,c}});
  const y=n(b.yieldQty)||1;return{rows,total,unit:total/y};
}
function explode(itemId,qty){ // multi-level: semi-finished with an approved BOM explodes further
  const leaves=new Map(),mids=[],missing=[];
  (function go(id,q,depth,path){
    const b=activeBom(id);
    if(!b){missing.push(id);return}
    const f=q/(n(b.yieldQty)||1);
    for(const l of b.lines||[]){
      const need=lineNeed(l)*f,it=byId('items',l.itemId);
      if(it&&activeBom(it.id)&&!path.includes(it.id)&&depth<8){mids.push({it,need,depth});go(it.id,need,depth+1,[...path,it.id])}
      else{const cur=leaves.get(l.itemId)||{it,need:0};cur.need+=need;leaves.set(l.itemId,cur)}
    }
  })(itemId,qty,0,[itemId]);
  return{leaves:[...leaves.values()],mids,missing};
}

/* ---------- render ---------- */
function setTab(t,id){view={tab:t,id:id||null};q='';render();window.scrollTo(0,0)}
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.toggleAttribute('aria-current',false));
  const cur=$('#t-'+view.tab);if(cur)cur.setAttribute('aria-current','page');
  $('#mode').textContent=LINKED?'مربوط بإمداد':mode==='db'?'متزامن':'على الجهاز ده بس';
  $('#mode').title=mode==='db'?'البيانات محفوظة ومشتركة مع اللي معاهم صلاحية':'مفيش قاعدة بيانات، البيانات محفوظة في المتصفح ده بس';
  if(loaded.size<COLS.length){return}
  fillLists();
  const app=$('#app');
  app.innerHTML=view.tab==='boms'?(view.id?bomForm(view.id):bomList()):view.tab==='calc'?calcView():(view.id?itemForm(view.id):itemList());
  if(view.tab==='calc')runCalc();
}
function fillLists(){
  const its=[...S.items].sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));
  $('#dl-items').innerHTML=its.map(i=>`<option value="${esc(itemLabel(i))}">`).join('');
  $('#dl-products').innerHTML=its.filter(i=>i.type==='finished'||i.type==='semi').map(i=>`<option value="${esc(itemLabel(i))}">`).join('');
}
const resolveItem=v=>{v=String(v||'').trim();if(!v)return null;return S.items.find(i=>itemLabel(i)===v)||S.items.find(i=>String(i.sku)===v||i.id===v)||S.items.find(i=>i.name===v)||null};
const hasSample=()=>S.items.some(i=>i.sample===true)||S.boms.some(b=>b.sample===true);
const sampleTag=x=>x.sample===true?' <span class="pill p-sample">مثال</span>':'';

function bomList(){
  const term=q.trim();
  let list=S.boms.map(b=>({b,it:byId('items',b.itemId)}));
  if(fSt)list=list.filter(x=>x.b.status===fSt);
  if(term)list=list.filter(x=>(x.b.code+' '+(x.it?.name||'')+' '+(x.it?.sku||'')).includes(term));
  list.sort((a,b)=>(a.it?.name||'').localeCompare(b.it?.name||'','ar')||b.b.version-a.b.version);
  const appr=S.boms.filter(b=>b.status==='approved');
  const prods=new Set(appr.map(b=>b.itemId)).size;
  const avg=appr.length?appr.reduce((s,b)=>s+n(bomCost(b).unit),0)/appr.length:0;

function syncDraftFromInputs(){
  if(!draft)return;
  const fi=$('#f-item');if(fi){const it=resolveItem(fi.value);draft.itemId=it?it.id:''}
  const fy=$('#f-yield');if(fy)draft.yieldQty=fy.value;
  const fn=$('#f-notes');if(fn)draft.notes=fn.value;
  document.querySelectorAll('.li-unit').forEach(el=>draft.lines[+el.dataset.k].unit=normU(el.value));
  document.querySelectorAll('.li-conv').forEach(el=>draft.lines[+el.dataset.k].conv=el.value);
  document.querySelectorAll('.li-item').forEach(el=>{const l=draft.lines[+el.dataset.k],it=resolveItem(el.value);
    if(it&&it.id!==l.itemId){l.unit=normU(it.unit);l.conv=''} // new item: start from its stock unit
    l.itemId=it?it.id:'';l._txt=el.value});
  document.querySelectorAll('.li-qty').forEach(el=>draft.lines[+el.dataset.k].qty=el.value);
  document.querySelectorAll('.li-scrap').forEach(el=>draft.lines[+el.dataset.k].scrap=el.value);
}
async function saveBom(status){
  syncDraftFromInputs();const d=draft,isNew=d._for==='new';
  const it=byId('items',d.itemId);
  if(!it){toast('اختار المنتج من القايمة.','bad');$('#f-item')?.classList.add('bad');return}
  if(n(d.yieldQty)<=0){toast('ناتج الباتش لازم يكون أكبر من صفر.','bad');return}
  const bad=d.lines.findIndex(l=>(l._txt||l.itemId||l.qty)&&(!l.itemId||n(l.qty)<=0));
  if(bad>=0){toast(`السطر ${bad+1}: اختار صنف موجود واكتب كمية أكبر من صفر.`,'bad');return}
  const nc=d.lines.findIndex(l=>l.itemId&&needsConv(l)&&n(l.conv)<=0);
  if(nc>=0){const l=d.lines[nc],it=byId('items',l.itemId);toast(`السطر ${nc+1}: اكتب الـ${it.unit} الواحد فيه كام ${l.unit}.`,'bad');$('#li-conv-'+nc)?.classList.add('bad');return}
  const lines=d.lines.filter(l=>l.itemId).map(l=>{const it=byId('items',l.itemId),u=normU(l.unit||it.unit),o={itemId:l.itemId,qty:n(l.qty),scrap:n(l.scrap),unit:u,stage:lineStage(l)};if(needsConv(l))o.conv=n(l.conv);return o});
  if(!lines.length){toast('ضيف مكون واحد على الأقل.','bad');return}
  if(lines.some(l=>l.itemId===it.id)){toast('المنتج مينفعش يبقى مكوّن في نفسه.','bad');return}
  let id=d._for,version=d.version;
  if(isNew){version=(bomsOf(it.id)[0]?.version||0)+1;id=safeId(`BOM-${it.sku||it.id}-${version}`)}
  const body={code:id,itemId:it.id,version,status:status||'draft',yieldQty:n(d.yieldQty),notes:d.notes||'',lines};
  if(d.sample)body.sample=true;
  if(status==='approved'){for(const o of S.boms.filter(b=>b.itemId===it.id&&b.status==='approved'&&b.id!==id))await put('boms',o.id,Object.assign({},o,{status:'archived'}),`اتأرشفت لما v${version} اتعتمدت`)}
  await put('boms',id,body,isNew?'إنشاء':status==='approved'?'اعتماد':'تعديل');
  draft=null;view.id=id;toast(status==='approved'?'القائمة اتعتمدت.':'اتحفظت.');render();
}

  const sel=view.id&&opts.some(o=>o.id===view.id)?view.id:(opts[0]?.id||'');
  return `<div class="bar"><h1>حاسبة الاحتياج</h1></div>
  ${opts.length?`<section class="panel"><div class="form">
    <label>المنتج<select class="in" id="c-item">${opts.map(o=>`<option value="${esc(o.id)}"${o.id===sel?' selected':''}>${esc(itemLabel(o))}</option>`).join('')}</select></label>
    <label>الكمية المطلوب تصنيعها<input class="in num" id="c-qty" inputmode="decimal" value="${esc(calcQty)}"><span class="hint" id="c-unit"></span></label>
  </div></section><div id="c-out"></div>`
  :`<section class="panel"><div class="empty"><b>مفيش قوائم معتمدة</b>الحاسبة بتشتغل على القوائم المعتمدة بس. اعتمد قائمة من «قوائم المواد».</div></section>`}`;
}
let calcQty=100,lastCalc=null;
function runCalc(){

  <section class="panel"><div class="panel-h"><h2>الاحتياج لـ ${fmt(qty)} ${esc(it.unit)} ${esc(it.name)}</h2><span class="grow"></span>${toAsk.length>1?`<button class="btn pri" data-act="rfqAll">اطلب عروض أسعار للنواقص (${toAsk.length})</button>`:''}<button class="btn" data-act="exportCalc">نزّل Excel</button></div>
  ${shorts&&!LINKED?'<div class="note" style="margin:10px 14px">طلب عروض الأسعار من النواقص بيشتغل في نسخة إمداد، وبيفتح الطلب هناك على طول.</div>':''}
  <div class="scroll"><table><thead><tr><th>الصنف</th><th>الوحدة</th><th class="num">المطلوب</th><th class="num">الرصيد</th><th class="num">النقص</th><th class="num">التكلفة</th><th></th></tr></thead><tbody>
  ${rows.map(x=>`<tr><td>${esc(x.it?.name||'صنف مش موجود')}<span class="sub code">${esc(x.it?.sku||'')}</span></td><td>${esc(x.it?.unit||'')}</td><td class="num">${fmt(x.need,3)}</td><td class="num">${fmt(x.oh,3)}</td><td class="num">${x.short?fmt(x.short,3):'—'}</td><td class="num">${money(x.cost)}</td><td>${state(x)}</td></tr>`).join('')}
  </tbody><tfoot><tr><td colspan="5">الإجمالي</td><td class="num">${money(tot)}</td><td></td></tr></tfoot></table></div></section>`;
}

  ${shown.map(i=>{const b=activeBom(i.id);return`<tr class="click" data-item="${esc(i.id)}" tabindex="0"><td><span class="code">${esc(i.sku||i.id)}</span></td><td>${esc(i.name)}${sampleTag(i)}</td><td>${esc(ITEM_T[i.type]||i.type||'')}</td><td>${esc(i.unit)}</td><td class="num">${money(i.cost)}</td><td class="num">${fmt(i.onHand,3)}</td><td>${b?`<span class="pill p-approved">${esc(b.code)}</span>`:''}</td></tr>`}).join('')}
  </tbody></table></div>${list.length>shown.length?`<div class="empty">بيظهر أول ${shown.length} من ${list.length}. دوّر أو فلتر عشان توصل للباقي.</div>`:''}`
  :`<div class="empty"><b>${S.items.length?'مفيش نتايج':'مفيش أصناف لسه'}</b>${S.items.length?'جرّب كلمة تانية.':'استورد ملف الأصناف من Excel (نفس ملف إمداد)، أو ضيف صنف بإيدك.'}</div>`}</section>
  <p class="hint">${LINKED?'الأصناف والأرصدة جاية من إمداد، والتعديل عليها من هناك.':'ملف Excel: أول شيت، والعناوين اللي بنقراها: الكود، اسم الصنف، النوع، الوحدة، التكلفة، الرصيد. الترتيب مش مهم، والصنف اللي كوده موجود بيتحدّث بدل ما يتكرر.'}</p>`;
}

  if(!i){view.id=null;return itemList()}
  const used=isNew?[]:S.boms.filter(b=>(b.lines||[]).some(l=>l.itemId===id)||b.itemId===id);
  return `<div class="crumb"><button data-act="back">الأصناف</button> / ${isNew?'جديد':esc(i.name)}</div>
  <div class="bar"><h1>${isNew?'صنف جديد':esc(i.name)}</h1><span class="grow"></span>${LINKED?'<span class="hint">للعرض بس. التعديل من إمداد.</span>':`<button class="btn pri" data-act="saveItem">احفظ</button>${isNew?'':'<button class="btn bad" data-act="delItem">امسح</button>'}`}</div>
  <section class="panel"><fieldset class="form" style="border:0;margin:0" ${LINKED?'disabled':''}>
    <label>الكود<input class="in" id="i-sku" value="${esc(i.sku||'')}" ${isNew?'':'readonly'} placeholder="نفس كود إمداد"><span class="hint">${isNew?'سيبه فاضي ويتعمل كود تلقائي.':'الكود ثابت عشان الربط مع إمداد.'}</span></label>
    <label class="full">اسم الصنف<input class="in" id="i-name" value="${esc(i.name||'')}" required></label>
    <label>النوع<select class="in" id="i-type">${Object.entries(ITEM_T).map(([k,l])=>`<option value="${k}"${i.type===k?' selected':''}>${l}</option>`).join('')}</select></label>
    <label>الوحدة<input class="in" id="i-unit" list="dl-units" value="${esc(i.unit||'')}"></label>
    <label>التكلفة (ج.م للوحدة)<input class="in num" id="i-cost" inputmode="decimal" value="${esc(i.cost)}"></label>
    <label>الرصيد<input class="in num" id="i-oh" inputmode="decimal" value="${esc(i.onHand)}"><span class="hint">${LINKED?'الرصيد الحالي في إمداد.':'للحاسبة بس. بعد الربط هيتقري من إمداد.'}</span></label>
  </fieldset></section>
  ${used.length?`<section class="panel"><div class="panel-h"><h2>بيستخدم في</h2></div><div class="kv">${used.map(b=>`<div><button class="lnk" data-open="${esc(b.id)}">${esc(b.code)}</button><span class="pill p-${b.status}">${ST[b.status]}</span></div>`).join('')}</div></section>`:''}`;
}
async function saveItem(){
  if(LINKED)return;
  const id=view.id,isNew=id==='new',v=s=>$(s).value.trim();
  const name=v('#i-name');if(!name){toast('اكتب اسم الصنف.','bad');$('#i-name').classList.add('bad');return}
  let sku=isNew?v('#i-sku'):byId('items',id).sku;
  let nid=id;
  if(isNew){if(!sku){nid=genNo('IT');sku=nid}else{nid=safeId('IT-'+sku)}if(byId('items',nid)){toast('الكود ده موجود قبل كده.','bad');return}}
  const prev=isNew?{}:byId('items',id);
  const body=Object.assign({},prev,{sku,name,type:$('#i-type').value,unit:v('#i-unit')||'قطعة',cost:n(v('#i-cost')),onHand:n(v('#i-oh'))});
  await put('items',nid,body,isNew?'إنشاء من قوائم المواد':'تعديل من قوائم المواد');
  toast('اتحفظ.');setTab('items');
}

/* ---------- Excel ---------- */
const TYPE_IN={'خامات':'raw','خامة':'raw','raw':'raw','مكونات':'component','مكون':'component','component':'component','تغليف':'packaging','تعبئة':'packaging','packaging':'packaging','نصف مصنع':'semi','نصف مصنّع':'semi','semi':'semi','منتج تام':'finished','تام':'finished','finished':'finished','مستلزمات':'supplies','مستلزمات وصيانة':'supplies','supplies':'supplies'};
async function importXl(file){
  if(!window.XLSX){toast('مكتبة Excel ما اتحملتش. اعمل ريفريش.','bad');return}
  const wb=XLSX.read(await file.arrayBuffer());const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  if(!rows.length){toast('الشيت الأول فاضي.','bad');return}
  const keys=Object.keys(rows[0]);const find=re=>keys.find(k=>re.test(String(k).trim()));
  const K={sku:find(/^(ال)?كود|code|sku/i),name:find(/اسم|^(ال)?صنف$|name/i),type:find(/نوع|type/i),unit:find(/وحد|unit/i),cost:find(/تكلف|سعر|cost|price/i),oh:find(/رصيد|كمي|on ?hand|qty/i)};
  if(!K.name){toast('مش لاقي عمود «اسم الصنف» في أول صف.','bad');return}
  let add=0,upd=0,skip=0;const writes=[];
  for(const r of rows){
    const name=String(r[K.name]||'').trim();if(!name){skip++;continue}
    const sku=K.sku?String(r[K.sku]).trim():'';
    const id=sku?safeId('IT-'+sku):(S.items.find(i=>i.name===name)?.id||genNo('IT'));
    const prev=byId('items',id);
    const t=TYPE_IN[String(K.type?r[K.type]:'').trim()]||prev?.type||'raw';
    const body=Object.assign({},prev||{},{sku:sku||prev?.sku||id,name,type:t,unit:String(K.unit?r[K.unit]:'').trim()||prev?.unit||'قطعة',cost:K.cost?n(r[K.cost]):n(prev?.cost),onHand:K.oh?n(r[K.oh]):n(prev?.onHand)});
    prev?upd++:add++;writes.push([id,body]);
  }
  $('#app').insertAdjacentHTML('afterbegin',`<div class="note" id="imp">بنستورد ${writes.length} صنف…</div>`);
  for(let k=0;k<writes.length;k+=25){await Promise.all(writes.slice(k,k+25).map(([id,b])=>put('items',id,b).catch(()=>{})));const el=$('#imp');if(el)el.textContent=`بنستورد… ${Math.min(k+25,writes.length)} من ${writes.length}`}
  toast(`اتضاف ${add} واتحدّث ${upd}${skip?`، واتساب ${skip} صف من غير اسم`:''}.`);render();
}
/* shortage → quote request in Emdad (linked only). Same shape Emdad's own rfqForm writes, so it shows up in طلبات عروض الأسعار. */
const openRfq=itemId=>S.rfqs.find(r=>r.itemId===itemId&&r.status==='open');
const ymd=o=>{const d=new Date();d.setDate(d.getDate()+o);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
async function createRfq(x){
  const {it:prod,qty}=lastCalc,id=genNo('RFQ');
  await put('rfqs',id,{no:id,itemId:x.it.id,qty:Math.ceil(x.short),neededBy:ymd(21),replyBy:ymd(5),
    notes:[x.it.specs,`نقص لتصنيع ${fmt(qty)} ${prod.unit} ${prod.name} (من قوائم المواد)`].filter(Boolean).join('\n'),
    status:'open',quotes:[],invited:{},date:ymd(0),ts:now()},'إنشاء من قوائم المواد');
  return id;
}
async function exportCalc(){
  if(!lastCalc||!window.XLSX)return;
  const {it,qty,rows}=lastCalc;
  const aoa=[[`احتياج ${qty} ${it.unit} ${it.name}`],[],['الكود','الصنف','الوحدة','المطلوب','الرصيد','النقص','سعر الوحدة','التكلفة']];
  rows.forEach(x=>aoa.push([x.it?.sku||'',x.it?.name||'',x.it?.unit||'',+x.need.toFixed(4),x.oh,null,n(x.it?.cost),null]));
  const ws=XLSX.utils.aoa_to_sheet(aoa);const last=aoa.length;
  for(let r=4;r<=last;r++){const x=rows[r-4];ws['F'+r]={t:'n',f:`MAX(0,D${r}-E${r})`,v:x.short};ws['H'+r]={t:'n',f:`D${r}*G${r}`,v:x.cost}}
  ws['A'+(last+1)]={t:'s',v:'الإجمالي'};ws['H'+(last+1)]={t:'n',f:`SUM(H4:H${last})`,v:rows.reduce((s,x)=>s+x.cost,0)};
  ws['!ref']=`A1:H${last+1}`;ws['!cols']=[{wch:12},{wch:34},{wch:8},{wch:12},{wch:12},{wch:12},{wch:12},{wch:14}];
  const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,'الاحتياج');
  const data=new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'}));
  const filename=`احتياج-${(it.sku||'')}-${qty}.xlsx`;
  const dl=window.claude?.use?await window.claude.use('downloads').catch(()=>null):null;
  try{if(dl){await dl.save({filename,data});return}
    const url=URL.createObjectURL(new Blob([data]));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
  catch(e){toast('التنزيل ما تمّش.','bad')}
}

/* ---------- events ---------- */
let armed=null;
function arm(btn,label){if(armed===btn){armed=null;return true}if(armed){armed.classList.remove('armed')}armed=btn;const old=btn.textContent;btn.classList.add('armed');btn.textContent=label;setTimeout(()=>{if(armed===btn){armed=null;btn.classList.remove('armed');btn.textContent=old}},3500);return false}
document.addEventListener('click',async e=>{
  const tab=e.target.closest('.tab');if(tab){draft=null;setTab(tab.dataset.tab);return}
  const open=e.target.closest('[data-open]');if(open){draft=null;view={tab:'boms',id:open.dataset.open};render();return}
  const itr=e.target.closest('[data-item]');if(itr){view={tab:'items',id:itr.dataset.item};render();return}
  const fst=e.target.closest('[data-fst]');if(fst){fSt=fst.dataset.fst;render();return}
  const fty=e.target.closest('[data-fty]');if(fty){fType=fty.dataset.fty;render();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='back'){draft=null;view.id=null;render()}
  else if(a==='newBom'){draft=null;view={tab:'boms',id:'new'};render()}
  else if(a==='addLine'){syncDraftFromInputs();draft.lines.push({itemId:'',qty:'',scrap:0,stage:b.dataset.stage||'dough'});render();$('#li-item-'+(draft.lines.length-1))?.focus()}
  else if(a==='rmLine'){syncDraftFromInputs();draft.lines.splice(+b.dataset.k,1);if(!draft.lines.length)draft.lines.push({itemId:'',qty:'',scrap:0,stage:'dough'});render()}
  else if(a==='saveBom')await saveBom('draft');
  else if(a==='approve'){if(arm(b,'متأكد؟ اعتمد'))await saveBom('approved')}
  else if(a==='archive'){const d=byId('boms',view.id);await put('boms',d.id,Object.assign({},d,{status:'archived'}),'أرشفة');draft=null;render()}
  else if(a==='newVersion'){const d=byId('boms',view.id);draft={itemId:d.itemId,version:0,status:'draft',yieldQty:d.yieldQty,notes:d.notes,lines:JSON.parse(JSON.stringify(d.lines)),_for:'new'};if(d.sample)draft.sample=true;view.id='new';render();toast('دي نسخة جديدة من القائمة. عدّل واحفظ، والقديمة فضلت زي ما هي.')}
  else if(a==='delBom'){if(arm(b,'دوس تاني للمسح')){await del('boms',view.id);draft=null;view.id=null;toast('اتمسحت.');render()}}
  else if(a==='toCalc'){const d=byId('boms',view.id);view={tab:'calc',id:d.itemId};render()}
  else if(a==='exportCalc')exportCalc();
  else if(a==='rfq'){const x=lastCalc?.rows.find(r=>r.it?.id===b.dataset.rid);if(!x||openRfq(x.it.id))return;b.disabled=true;try{const id=await createRfq(x);toast(`اتفتح ${id} في إمداد لـ ${fmt(Math.ceil(x.short))} ${x.it.unit} ${x.it.name}.`)}catch(e){b.disabled=false}}
  else if(a==='rfqAll'){const xs=lastCalc.rows.filter(x=>x.short>0&&x.it&&!openRfq(x.it.id));if(!arm(b,`متأكد؟ هيتفتح ${xs.length} طلب`))return;b.disabled=true;let ok=0;for(const x of xs){try{await createRfq(x);ok++}catch(e){break}}if(ok)toast(`اتفتح ${ok} طلب عرض سعر في إمداد.`)}
  else if(a==='newItem'){view={tab:'items',id:'new'};render()}
  else if(a==='saveItem')await saveItem();
  else if(a==='delItem'){const used=S.boms.some(x=>x.itemId===view.id||(x.lines||[]).some(l=>l.itemId===view.id));if(used){toast('الصنف ده داخل في قائمة مواد. شيله منها الأول.','bad');return}if(arm(b,'دوس تاني للمسح')){await del('items',view.id);toast('اتمسح.');setTab('items')}}
  else if(a==='importXl')$('#xlFile').click();
  else if(a==='clearSample'){if(arm(b,'متأكد؟ امسح')){for(const x of S.boms.filter(x=>x.sample===true))await del('boms',x.id);for(const x of S.items.filter(x=>x.sample===true))await del('items',x.id);toast('بيانات المثال اتمسحت.')}}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const r=e.target.closest('tr.click');if(r)r.click()}});
document.addEventListener('change',e=>{
  if(e.target.id==='xlFile'&&e.target.files[0]){importXl(e.target.files[0]);e.target.value=''}
  if(e.target.id==='c-item'){view.id=e.target.value;runCalc()}
  if(e.target.matches('.li-item,#f-item,#f-yield,.li-qty,.li-scrap,.li-unit,.li-conv')){syncDraftFromInputs();const f=document.activeElement?.id;render();if(f)document.getElementById(f)?.focus()}
});
let qT;document.addEventListener('input',e=>{
  if(e.target.id==='q'){clearTimeout(qT);qT=setTimeout(()=>{q=e.target.value;const pos=e.target.selectionStart;render();const el=$('#q');if(el){el.focus();el.setSelectionRange(pos,pos)}},200)}
  if(e.target.id==='c-qty')runCalc();
  if(e.target.classList.contains('bad'))e.target.classList.remove('bad');
});

/* ---------- boot ---------- */
let rT;const schedule=()=>{clearTimeout(rT);rT=setTimeout(()=>{const ae=document.activeElement;if(ae&&ae.closest&&ae.closest('#app')&&ae.matches('input,textarea,select'))return;if(view.tab==='items'&&view.id&&$('#i-name'))return;render()},40)};
(async()=>{
  const c=window.claude;
  if(c&&typeof c.use==='function'){try{db=await c.use('db')}catch(e){db=null}}
  if(db)mode='db';else{db=localDb();mode='local'}
  if(LINKED){try{const u=await c.use('user');meId=(u&&await u.id())||''}catch(e){}} // Emdad shows who created the RFQ
  const slow=setTimeout(()=>{if(loaded.size<COLS.length)$('#app').innerHTML='<div class="empty"><b>البيانات لسه ما وصلتش</b>الاتصال بطيء. استنى شوية.</div>'},10000);
  COLS.forEach(col=>db.collection(col).onSnapshot(snap=>{S[col]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));loaded.add(col);if(loaded.size===COLS.length)clearTimeout(slow);schedule()},
    err=>{loaded.add(col);schedule();toast('الاتصال بالبيانات وقف. اعمل ريفريش.','bad')}));
  render();
})();
