<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استبيان الفروع - الحلواني خالد عمر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;700&family=Lalezar&display=swap" rel="stylesheet">
<style>
/* Plan: brand burgundy + gold. Branch fills item cards with reason chips; owner sees a results tab. */
:root{
  --bg:#f7f4f2; --panel:#ffffff; --ink:#2a1a1c; --muted:#7a6a6c; --line:#e7dfdc;
  --accent:#7a1f2b; --accent-soft:#f3e5e7; --gold:#b8892a; --gold-soft:#f6eedb;
  --ok:#2e7d4f; --bad:#b3261e;
  --display:"Lalezar","Readex Pro",Tahoma,sans-serif; --body:"Readex Pro",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1214; --panel:#241a1c; --ink:#f2e9ea; --muted:#b39fa2; --line:#3a2b2e;
  --accent:#e08a96; --accent-soft:#3a2328; --gold:#e0b65a; --gold-soft:#3a3020; --ok:#6fcf97; --bad:#ff8a80; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1a1214; --panel:#241a1c; --ink:#f2e9ea; --muted:#b39fa2; --line:#3a2b2e;
  --accent:#e08a96; --accent-soft:#3a2328; --gold:#e0b65a; --gold-soft:#3a3020; --ok:#6fcf97; --bad:#ff8a80; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:30px;margin:0;color:var(--accent);text-wrap:balance}
.lead{margin:4px 0 0;color:var(--muted)}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;padding:8px 16px;border-radius:10px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:60px;resize:vertical}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.pbar{flex:1;height:8px;background:var(--gold-soft);border-radius:4px;overflow:hidden}
.pbar span{display:block;height:100%;background:var(--gold);width:0}
.secf{display:flex;gap:6px;flex-wrap:wrap}
.secf button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.secf button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item{border-inline-start:4px solid var(--line)}
.item.done{border-inline-start-color:var(--ok)}
.item h3{margin:0;font-size:17px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.pill{font-size:12px;padding:1px 10px;border-radius:999px;background:var(--gold-soft)}
.pill.bad{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.no[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.extra{display:grid;gap:8px;margin-top:10px}
.btn{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:10px 20px;cursor:pointer;font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}
.msg{font-size:13px}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.note{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
.rbar{display:flex;align-items:center;gap:6px;white-space:nowrap}
.rbar i{display:inline-block;height:8px;background:var(--accent);border-radius:4px}
.notes li{margin-bottom:4px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>استبيان أسباب انخفاض الأصناف</h1>
    <p class="lead">الأصناف دي مبيعاتها نزلت في أكتوبر 2026 مقارنة بأكتوبر 2025. اختار فرعك، وقولّنا من واقع الفرع إيه سبب النزول في كل صنف. ممكن تختار أكتر من سبب.</p>
  </header>

  <section id="form-view" style="display:flex;flex-direction:column;gap:16px">
    <div class="card">
      <div class="row">
        <label for="branch">الفرع<select id="branch"><option value="">اختار الفرع</option></select></label>
        <label for="who">اسمك<input id="who" placeholder="مثال: أحمد محمود"></label>
        <label for="role">وظيفتك<select id="role"><option value="">اختار</option><option>مدير فرع</option><option>مشرف وردية</option><option>بائع</option><option>أخرى</option></select></label>
      </div>
      
    </div>

    <div class="progress"><span id="prog-t">0 من 0</span><div class="pbar"><span id="prog-b"></span></div></div>
    <div class="secf" id="secf" role="group" aria-label="فلتر القسم">
      <button data-s="" aria-pressed="true">كل الأقسام</button><button data-s="الغربي" aria-pressed="false">الغربي</button><button data-s="الشرقي" aria-pressed="false">الشرقي</button><button data-s="البكري" aria-pressed="false">البكري</button>
    </div>
    <div id="items" style="display:flex;flex-direction:column;gap:12px"></div>

    <div class="card">
      <label for="general">أي اقتراح عام لزيادة مبيعات الأصناف دي؟<textarea id="general" placeholder="اكتب اقتراحك (اختياري)"></textarea></label>
    </div>

    <div class="sticky">
      <button class="btn" id="send">إرسال الإجابات</button>
      <span class="msg" id="msg"></span>
    </div>
  </section>
  <p class="note">إعداد: أ. محمد زيدان</p>
</div>
