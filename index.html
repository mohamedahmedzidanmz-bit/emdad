<style>
/* Layout: Odoo-style shell. Purple app navbar on top, a control panel band (breadcrumb, search, filters, view switcher) over list/kanban views,
   and records opening as a full-page form sheet with a statusbar, smart buttons and a chatter column. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --sunk:#F6F7F9; --ink:#1F2933; --muted:#5F6B76; --line:#DEE2E6;
  --accent:#714B67; --accent-ink:#FFFFFF; --accent-soft:#F1E9EF; --link:#017E84; --btn2:#E7E9ED; --btn2-h:#D8DBE1;
  --nav:#714B67; --nav-ink:#FFFFFF; --nav-hover:rgba(255,255,255,.14);
  --home-bg:linear-gradient(160deg,#F5EEF3 0%,#E8EEF4 100%);
  --ok:#1B7A48; --ok-soft:#E3F2E9; --warn:#A85F00; --warn-soft:#FCEFD9; --bad:#B42318; --bad-soft:#FBE6E3; --info:#017E84; --info-soft:#E0F2F2;
  --rail:#15201C; --rail-ink:#E6ECE9; --rail-muted:#8FA09A;
  --f-display:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1F26; --surface:#262A33; --sunk:#2D323C; --ink:#E4E6EB; --muted:#A0A7B3; --line:#3A404C;
  --accent:#C49BBB; --accent-ink:#1C1F26; --accent-soft:#3A2D37; --link:#4CC3C9; --btn2:#353A45; --btn2-h:#424855;
  --nav:#4A3045; --nav-ink:#FFFFFF; --nav-hover:rgba(255,255,255,.12);
  --home-bg:linear-gradient(160deg,#2A2029 0%,#1C2028 100%);
  --ok:#55C48C; --ok-soft:#143024; --warn:#F0A83A; --warn-soft:#33260F; --bad:#F27466; --bad-soft:#3A1915; --info:#4CC3C9; --info-soft:#123234;
  --rail:#0A0F0D; --rail-ink:#E3EAE6; --rail-muted:#7C8C86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1F26; --surface:#262A33; --sunk:#2D323C; --ink:#E4E6EB; --muted:#A0A7B3; --line:#3A404C;
  --accent:#C49BBB; --accent-ink:#1C1F26; --accent-soft:#3A2D37; --link:#4CC3C9; --btn2:#353A45; --btn2-h:#424855;
  --nav:#4A3045; --nav-ink:#FFFFFF; --nav-hover:rgba(255,255,255,.12);
  --home-bg:linear-gradient(160deg,#2A2029 0%,#1C2028 100%);
  --ok:#55C48C; --ok-soft:#143024; --warn:#F0A83A; --warn-soft:#33260F; --bad:#F27466; --bad-soft:#3A1915; --info:#4CC3C9; --info-soft:#123234;
  --rail:#0A0F0D; --rail-ink:#E3EAE6; --rail-muted:#7C8C86; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding-block:20px;padding-inline:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh}
.brand{display:flex;flex-direction:column;gap:2px;padding-inline:8px}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:0}
.brand span{font-size:12px;color:var(--rail-muted)}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;min-height:0}
.ng{font-size:11px;color:var(--rail-muted);padding:12px 10px 3px;letter-spacing:.04em}
.line.np,.lh.np{grid-template-columns:minmax(0,2fr) minmax(0,1fr) 30px}
.line.rc4,.lh.rc4{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:var(--r);color:var(--rail-ink);font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav .n{font-family:var(--f-mono);font-size:11px;min-width:22px;text-align:center;padding:1px 6px;border-radius:20px;background:rgba(255,255,255,.12)}
.nav .n.hot{background:var(--warn);color:#1a1200}
.me{margin-top:auto;padding:0 10px;display:flex;flex-direction:column;font-size:12.5px;line-height:1.4}
.me:empty{display:none}
.me b{font-weight:600}
.me span{color:var(--rail-muted);font-size:12px}
.me:not(:empty)+.setbtn{margin-top:6px}
details.hist summary{cursor:pointer;color:var(--muted);font-size:13px;padding:4px 0}
details.hist .panel{margin-top:8px}
.bars{display:flex;flex-direction:column;gap:8px;padding:12px 16px}
.bar{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar .track i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar b{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.gate{max-width:560px;margin:40px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.gate h1{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0}
.gate p{color:var(--muted);margin:0}
.picker{position:relative}
.picker .res{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-top:6px}
.picker .res div{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.picker .res div:last-child{border-bottom:0}
.picker .res span{flex:1;min-width:120px}
.setbtn{all:unset;cursor:pointer;margin-top:auto;padding:8px 10px;border-radius:var(--r);color:var(--rail-muted);font-size:13px;border:1px solid rgba(255,255,255,.12);text-align:center}
.setbtn:hover{color:var(--rail-ink);border-color:var(--rail-muted)}
.setbtn:focus-visible{outline:2px solid var(--accent)}
.invite{display:flex;flex-direction:column}
.invite .ir{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.invite .ir:last-child{border-bottom:0}
.invite .ir .nm{flex:1;min-width:140px}
.invite .ir .nm span{display:block;color:var(--muted);font-size:12px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.btn.wa{background:#1F8F4E;border-color:#1F8F4E;color:#fff}
textarea.paste{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px;width:100%;min-height:150px;font-family:var(--f-mono);font-size:12px;direction:ltr}
.rail .sync{margin-top:0;font-size:12px;color:var(--rail-muted);padding-inline:8px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rail-muted);flex:none}
.dot.live{background:#55C48C}.dot.local{background:#F0A83A}
main{min-width:0;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{font-family:var(--f-display);font-size:26px;font-weight:600;margin:0;text-wrap:balance}
.head p{margin:2px 0 0;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:var(--r);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ro .w{display:none!important}
.search{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;min-width:0;width:220px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;position:relative}
.kpi small{color:var(--muted);font-size:12px;letter-spacing:.02em}
.kpi b{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>h2{font-family:var(--f-display);font-size:15px;font-weight:600;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel>h2 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12px}
.pbody{padding:12px 16px}
.alist{list-style:none;margin:0;padding:0}
.alist li{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.alist li:last-child{border-bottom:0}
.alist .sev{width:4px;align-self:stretch;border-radius:2px;flex:none}
.sev.bad{background:var(--bad)}.sev.warn{background:var(--warn)}.sev.info{background:var(--info)}.sev.ok{background:var(--ok)}
.alist .tx{flex:1;min-width:0}
.alist .tx b{display:block;font-weight:600}
.alist .tx span{color:var(--muted);font-size:12.5px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-weight:500;font-size:12px;color:var(--muted);text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
td.num,th.num{text-align:end;white-space:nowrap}
td .sub{display:block;color:var(--muted);font-size:12px}
.code{font-family:var(--f-mono);font-size:12px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-warn{background:var(--warn-soft);color:var(--warn)}.t-bad{background:var(--bad-soft);color:var(--bad)}.t-info{background:var(--info-soft);color:var(--info)}.t-mute{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.grade{font-family:var(--f-display);font-weight:700;width:26px;height:26px;display:inline-grid;place-items:center;border-radius:50%;font-size:13px}
.meter{height:6px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;overflow:hidden;min-width:70px;margin-top:4px}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.warn{background:var(--warn)}.meter i.bad{background:var(--bad)}
.steps{display:flex;gap:3px;align-items:center}
.steps i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:16px;margin-bottom:4px}
.onboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.onboard div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.onboard em{font-style:normal;font-family:var(--f-mono);color:var(--accent);font-size:12px}
.onboard b{font-family:var(--f-display);font-weight:600}
.onboard span{color:var(--muted);font-size:13px;flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.card .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card .meta{color:var(--muted);font-size:12.5px}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* drawer */
.drawer{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-start}
.scrim{position:absolute;inset:0;background:rgba(10,15,13,.42)}
.sheet{position:relative;background:var(--bg);width:min(640px,100%);height:100%;overflow-y:auto;box-shadow:0 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding-block:14px;padding-inline:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:1}
.sheet header h2{margin:0;font-family:var(--f-display);font-size:18px;font-weight:600}
.sheet .sb{padding:18px 20px 40px;display:flex;flex-direction:column;gap:18px}
.icon{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:var(--r);font-size:18px;color:var(--muted)}
.icon:hover{background:var(--sunk);color:var(--ink)}
.icon:focus-visible{outline:2px solid var(--accent)}
form{display:flex;flex-direction:column;gap:14px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f>span{font-size:12.5px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea,.line input,.line select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.f small{color:var(--muted);font-size:12px}
.f input:disabled{background:var(--sunk);color:var(--muted)}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) 30px;gap:8px;align-items:center}
.line.rcv{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr)}
.lh{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) 30px;gap:8px;font-size:12px;color:var(--muted)}
.lh.rcv{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding-top:6px}
.actions .gap{display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv small{color:var(--muted);font-size:12px}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sec{font-family:var(--f-display);font-weight:600;font-size:14px;margin:0}
.hint{border-radius:var(--r);padding:10px 12px;font-size:13px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:500;z-index:40;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast.bad{background:var(--bad);color:#fff}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;gap:12px;padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));z-index:10;overflow-x:auto}
  .brand span,.rail .sync span{display:none}
  .brand b{font-size:16px;white-space:nowrap}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap;padding:7px 10px}
  .rail .sync{margin-top:0}
  .setbtn{margin-top:0;white-space:nowrap}
  .me{margin-top:0;white-space:nowrap}
  .me span{display:none}
  .ng{display:none}
  .nav{overflow:visible}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .fg{grid-template-columns:1fr}
  .head h1{font-size:22px}
  .search{width:100%}
  .line,.lh{grid-template-columns:minmax(0,1fr) 70px 80px 30px}
  .line.np,.lh.np{grid-template-columns:minmax(0,1fr) 80px 30px}
  .line.rc4,.lh.rc4{grid-template-columns:minmax(0,1fr) 60px 60px 70px}
}
/* ================= Odoo shell ================= */
:root{--nav-h:46px}
.app{display:block;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--nav)}
.o-nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;height:var(--nav-h);background:var(--nav);color:var(--nav-ink);display:flex;align-items:center;gap:2px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.o-nav svg{fill:currentColor}
.o-nav :focus-visible{outline:2px solid #fff;outline-offset:-3px}
.o-apps{all:unset;cursor:pointer;width:40px;height:var(--nav-h);display:grid;place-items:center;flex:none}
.o-apps svg{width:20px;height:20px}
.o-apps:hover,.o-menu button:hover,.o-sys button:hover{background:var(--nav-hover)}
.o-appname{font-weight:600;font-size:16px;padding-inline:6px 14px;white-space:nowrap}
.o-menu{display:flex;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}
.o-menu::-webkit-scrollbar{display:none}
.o-menu button{all:unset;cursor:pointer;padding:0 12px;height:var(--nav-h);display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:14px}

/* ---------- master-data codes (scheme: SUP-R-001 · RM-01-0007 · WH01 · PRD-10) ---------- */
const SUP_PFX={raw:'R',component:'C',packaging:'P',service:'S',other:'O'};
const ITEM_PFX={raw:'RM',component:'CP',packaging:'PK',finished:'FG'};
const WH_T={raw:'خامات',component:'مكونات',packaging:'تغليف',finished:'منتج تام',quarantine:'حجر (منتظر فحص)',reject:'مرفوضات وهالك',other:'أخرى'};
const DEPT_K={prod:['إنتاجي','PRD'],service:['خدمي','SRV']};
// next free number after the highest existing code with this prefix (step 10 for departments)
function nextCode(codes,prefix,width,step){step=step||1;let max=0;codes.forEach(c=>{c=String(c||'');if(c.startsWith(prefix)){const n=parseInt(c.slice(prefix.length),10);if(n>max)max=n}});return prefix+String(step>1?Math.floor(max/step)*step+step:max+1).padStart(width,'0')}
const nextSupCode=(cat,except)=>nextCode(S.suppliers.filter(s=>s.id!==except).map(s=>s.code),'SUP-'+(SUP_PFX[cat]||'O')+'-',3);
const grp2=g=>String(parseInt(g,10)||1).padStart(2,'0');
const nextSku=(type,grp,except)=>nextCode(S.items.filter(i=>i.id!==except).map(i=>i.sku),(ITEM_PFX[type]||'IT')+'-'+grp2(grp)+'-',4);
const nextWhCode=except=>nextCode(S.warehouses.filter(w=>w.id!==except).map(w=>w.code),'WH',2);
// departments share one numbering line (PRD-10…PRD-60, then SRV-70…) so the number alone stays unique
function nextDeptCode(kind,except){let max=0;S.depts.filter(d=>d.id!==except).forEach(d=>{const n=parseInt(String(d.code||'').replace(/^\D+-?/,''),10);if(n>max)max=n});return DEPT_K[kind][1]+'-'+String(Math.floor(max/10)*10+10).padStart(2,'0')}
const codeTaken=(col,field,val,except)=>!!val&&S[col].some(x=>x.id!==except&&String(x[field]||'').trim().toUpperCase()===val.trim().toUpperCase());
// keeps a code field in sync with its suggestion while the user hasn't typed their own code
function autoCode(input,suggest,triggers){let last=input.value;const upd=()=>{if(!input.value.trim()||input.value===last){const v=suggest();input.value=v;last=v}};triggers.forEach(t=>t&&t.addEventListener('input',upd));triggers.forEach(t=>t&&t.addEventListener('change',upd))}

/* ---------- RFQs ---------- */
function quoteRank(r){
  const now=today();const qs=(r.quotes||[]).map(q=>Object.assign({},q,{valid:!q.validUntil||q.validUntil>=now}));
  const v=qs.filter(q=>q.valid&&+q.price>0);if(!v.length)return qs;
  const cmp=q=>q.vat==='inc'?q.price/1.14:+q.price; // compare all prices before 14% VAT
  const minP=Math.min(...v.map(cmp)),minL=Math.min(...v.map(q=>Math.max(1,+q.leadDays||1)));
  v.forEach(q=>{const st=supStats(q.supplierId).score;q.idx=Math.round(((minP/cmp(q))*.5+(minL/Math.max(1,+q.leadDays||1))*.2+((st??70)/100)*.3)*100);q.cheapest=cmp(q)===minP;q.fastest=Math.max(1,+q.leadDays||1)===minL});
  const best=Math.max(...v.map(q=>q.idx));v.forEach(q=>q.best=q.idx===best);return qs;
}

/* ---------- supplier links ---------- */
function rfqPayload(r,sid){const s=sid&&byId('suppliers',sid);const c=cfg();return{v:1,r:r.id,no:r.no,i:itemName(r.itemId),u:itemUnit(r.itemId),q:r.qty,d:r.neededBy||'',due:r.replyBy||'',x:(r.notes||'').slice(0,200),c:c.company||'',w:waNum(c.whatsapp),s:s?s.id:'',n:s?s.name:''}}
// The artifact viewer only forwards a #hash up to ~128 chars, so the link is packed: single-byte Arabic, \x1f-joined fields, base64url, ≤89 bytes (≤120 chars).
const LINK_MAX_BYTES=89;
const shortId=(id,p)=>{id=String(id||'');return id.startsWith(p+'-')?id.slice(p.length+1):id};
const packDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')?d.slice(2,4)+d.slice(5,7)+d.slice(8,10):'';
const linkClean=s=>String(s||'').replace(/[\x00-\x1f]/g,' ').replace(/×/g,'x').replace(/µ/g,'u').replace(/ک/g,'ك').replace(/ی/g,'ي').replace(/\s+/g,' ').trim();
function toBytes(s){const out=[];for(const ch of s){const c=ch.codePointAt(0);out.push(c<128?c:(c>=0x0600&&c<=0x067F?c-0x0600+128:63))}return out}
function inviteLink(r,sid){
  const c=cfg(),wa=waNum(c.whatsapp);
  const fixed=['2',shortId(r.id,'RFQ'),sid?shortId(sid,'SUP'):'',String(+(+r.qty||0).toFixed(3)),linkClean(itemUnit(r.itemId)).slice(0,6),packDate(r.neededBy),packDate(r.replyBy),wa?parseInt(wa,10).toString(36):''];
  let item=linkClean(itemName(r.itemId)),comp=linkClean(c.company);
  const room=Math.max(0,LINK_MAX_BYTES-toBytes(fixed.join('\x1f')).length-2);
  let cl=Math.min(comp.length,Math.max(0,room-item.length));
  if(cl<Math.min(comp.length,10))cl=Math.min(comp.length,10,Math.max(0,room-8));
  comp=comp.slice(0,cl);item=item.slice(0,Math.max(0,room-comp.length));
  let bin='';toBytes([...fixed,comp,item].join('\x1f')).forEach(b=>bin+=String.fromCharCode(b));
  return formUrl()+'#q'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
const toNum=s=>{s=String(s??'').trim().replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/٫/g,'.').replace(/[٬,\s]/g,'');return s===''?NaN:Number(s)};
function inviteMsg(r,sid){const s=sid&&byId('suppliers',sid);const c=cfg();return[`السلام عليكم${s&&s.contact?' '+s.contact:''}،`,`${c.company||'المصنع'} بيطلب عرض سعر على:`,`${itemName(r.itemId)} · ${num(r.qty)} ${itemUnit(r.itemId)}`,r.notes?`المواصفات: ${r.notes}`:'',r.neededBy?`مطلوب قبل ${r.neededBy}`:'',r.replyBy?`ياريت الرد قبل ${r.replyBy}`:''].filter(Boolean).concat(['','املا عرضك من اللينك ده (دقيقة واحدة):',inviteLink(r,sid)]).join('\n')}
function inviteHtml(r){
  const c=cfg(),inv=r.invited||{},replied=new Set((r.quotes||[]).map(q=>q.supplierId)),itype=(byId('items',r.itemId)||{}).type;
  const sups=S.suppliers.filter(s=>s.status!=='blocked').sort((a,b)=>(b.category===itype)-(a.category===itype)||a.name.localeCompare(b.name,'ar'));
  const row=s=>`<div class="ir"><div class="nm"><b>${esc(s.name)}</b><span>${s.phone?`<span class="code">${esc(s.phone)}</span>`:'مفيش رقم مسجل، واتساب هيفتح تختار جهة الاتصال'}</span></div>${replied.has(s.id)?chip('رد بعرض','ok'):inv[s.id]?chip('اتبعت '+inv[s.id],'info'):''}<span class="tags"><a class="btn sm wa" href="https://wa.me/${waNum(s.phone)}?text=${encodeURIComponent(inviteMsg(r,s.id))}" target="_blank" rel="noopener" data-a="invite" data-id="${r.id}" data-s="${s.id}">واتساب</a><button class="btn sm" data-a="copyInvite" data-id="${r.id}" data-s="${s.id}">انسخ</button></span></div>`;

function parseReply(t){
  const m=String(t||'').match(/EMDAD[12]\.([A-Za-z0-9_-]+)/);
  if(!m)return{ok:false,err:'مش لاقي كود العرض في الرسالة. اتأكد إنك نسخت رسالة المورد كلها.'};
  let d;try{d=b64d(m[1])}catch(e){return{ok:false,err:'الكود اتقطع أثناء النسخ. اطلب من المورد يبعت الرسالة تاني.'}}
  const r=byId('rfqs',d.r)||byId('rfqs','RFQ-'+d.r);
  d.sid=d.s?((byId('suppliers',d.s)||byId('suppliers','SUP-'+d.s)||{}).id||''):'';
  d.cur=d.cur||'EGP';
  if(!r)return{ok:false,err:'الطلب ده مش موجود عندك، يمكن يكون اتحذف.'};
  if(r.status!=='open')return{ok:false,err:`طلب ${r.no} مقفول (${RFQ_ST[r.status][0]}). العرض ده مش هيتضاف.`};
  if(!(+d.p>0))return{ok:false,err:'السعر اللي في الكود مش سليم.'};
  return{ok:true,d,r};
}

function sendTarget(p,val){

    f.supplierId.addEventListener('change',draw);draw();

  <form class="main"><div class="fg">
    ${fld('حجم العينة المفحوصة','sample',{type:'number',value:a.n,req:true,attrs:'min="1"'})}

    ${fld('الكمية المقبولة','accepted',{type:'number',value:x.qty,req:true,attrs:`min="0" max="${x.qty}" step="any"`,hint:'المرفوض = اللوط ناقص المقبول'})}
    ${area('ملاحظات الفحص / وصف العيوب','notes','')}

    if(acc>0){const it=byId('items',x.itemId);const oh=Math.max(0,+it.onHand||0);const cost=x.price?Math.round(((oh*(+it.cost||0))+acc*x.price)/(oh+acc)*100)/100:it.cost;await addMovement(x.itemId,acc,'receipt',x.no,`لوط ${x.lot}`,{cost})}

    ['crit','major'].forEach(n=>f[n].addEventListener('input',upd));
  });

// reads the sheet rows into a plan: what will be created, updated, or skipped (with the reason)
function buildImport(k,raw){
  const t=XL[k];if(!raw.length)throw new Error('الملف فاضي');
  const norm=s=>String(s??'').replace(/\*/g,'').replace(/\s+/g,' ').trim();
  const idx={};raw[0].forEach((h,i)=>{const c=t.cols.find(c=>norm(c[1])===norm(h)||c[0]===norm(h));if(c&&idx[c[0]]==null)idx[c[0]]=i});
  if(idx.name==null)throw new Error(`مش لاقي عمود «${norm(t.cols[1][1])}». استخدم القالب ومتغيّرش العناوين.`);
  const catR=revMap(SUP_CAT),stR=revMap(Object.fromEntries(Object.entries(SUP_ST).map(([a,v])=>[a,v[0]]))),typR=revMap(ITEM_T);
  const codes=(k==='suppliers'?S.suppliers.map(s=>s.code):S.items.map(i=>i.sku)).map(c=>String(c||'').toUpperCase()),seen=new Set(),out=[];
  raw.slice(1).forEach((r,n)=>{
    if(r.every(v=>String(v??'').trim()===''))return;
    const g=f=>idx[f]==null?'':String(r[idx[f]]??'').trim();
    const numv=f=>{const v=g(f);if(v==='')return null;const x=toNum(v);if(isNaN(x)){row.errors.push(`«${norm(t.cols.find(c=>c[0]===f)[1])}» مش رقم`);return null}return x};
    const row={line:n+2,errors:[],data:{},target:null,warn:''},name=g('name');
    if(!name)row.errors.push('الاسم فاضي');
    if(k==='suppliers'){
      const cat=catR[g('category')]||'';if(!cat)row.errors.push('الفئة مش معروفة');
      const st=g('status')?stR[g('status')]:'approved';if(!st)row.errors.push('الحالة مش معروفة');
      let cd=g('code').toUpperCase();const ex=(cd&&S.suppliers.find(s=>String(s.code||'').toUpperCase()===cd))||(name&&S.suppliers.find(s=>s.name.trim()===name));row.target=ex?ex.id:null;
      if(!cd)cd=ex&&ex.code?ex.code:(cat?nextCode(codes,'SUP-'+(SUP_PFX[cat]||'O')+'-',3):'');
      if(cd&&S.suppliers.some(s=>s.id!==(ex&&ex.id)&&String(s.code||'').toUpperCase()===cd))row.errors.push('الكود مستخدم لمورد تاني');
      if(cd&&seen.has(cd))row.errors.push('الكود متكرر في الملف');
      const lead=numv('leadDays');
      row.data={code:cd,name,category:cat,status:st||'approved',contact:g('contact'),phone:g('phone'),email:g('email'),city:g('city'),leadDays:lead,terms:g('terms'),notes:g('notes')};
    }else{

  const nQ=sheet('الجودة',['رقم الفحص','التاريخ','المورد','الصنف','اللوط','الكمية','المقبول','المرفوض','نسبة القبول','القرار','NCR'],qRows,[16,11,24,30,14,10,10,10,12,12,16]);

  const ws=X.utils.aoa_to_sheet(summary);ws['!cols']=[{wch:28},{wch:20}];X.utils.book_append_sheet(wb,ws,'ملخص');

  xlTemplate:(d,b)=>run(async()=>{const t=b.textContent;b.disabled=true;b.textContent='بنجهّز…';try{await downloadTemplate(d.k)}finally{b.disabled=false;b.textContent=t}}),
  xlImportSup:()=>importForm('suppliers'),xlImportItems:()=>importForm('items'),
  addWh:()=>whForm(),editWh:d=>whForm(d.id),
  seedWh:(d,b)=>run(async()=>{b.disabled=true;for(const[c,n,t]of WH_SEED)if(!codeTaken('warehouses','code',c))await put('warehouses',genNo('WH'),{code:c,name:n,type:t,keeper:'',notes:'',active:'yes'});toast('اتضافت المخازن المقترحة. عدّل الأسامي براحتك')}),
  addDept:()=>deptForm(),editDept:d=>deptForm(d.id),
  seedDept:(d,b)=>run(async()=>{b.disabled=true;for(const[c,n,k]of DEPT_SEED)if(!codeTaken('depts','code',c))await put('depts',genNo('DEP'),{code:c,name:n,kind:k,manager:'',active:'yes'});toast('اتضافت الأقسام المقترحة. عدّل الأسامي براحتك')}),
  addItem:()=>itemForm(),editItem:d=>itemForm(d.id),move:d=>moveForm(d.id),
  addRfq:()=>rfqForm(),rfqFromItem:d=>rfqForm(d.id),openRfq:d=>openRfq(d.id),
  award:d=>run(async()=>{const r=byId('rfqs',d.id),q=(r.quotes||[]).find(x=>x.id===d.q);if(!q)return;
    const nid=genNo('PO'),qty=q.qa&&q.qa<r.qty?q.qa:r.qty,tg=sendTarget(null,qty*q.price),act=tg.act;delete tg.act;
    await put('pos',nid,Object.assign({no:nid,date:today(),ts:Date.now(),receipts:[],supplierId:q.supplierId,expected:addDays(today(),q.leadDays||14),notes:`ترسية على ${r.no}${q.terms?' · دفع '+q.terms:''}`,lines:[{itemId:r.itemId,qty,price:q.price,received:0}],rfqId:r.id},tg),'إنشاء من ترسية '+r.no+' · '+act);
    await patch('rfqs',r.id,{status:'awarded',awardedQuoteId:q.id,poId:nid},'ترسية على '+supName(q.supplierId));toast(tg.status==='pending'?`اترسى على ${supName(q.supplierId)} و${nid} مستني اعتماد الإدارة`:`اترسى على ${supName(q.supplierId)} واتعمل ${nid}`);openPo(nid)}),
  delQuote:d=>run(async()=>{const r=byId('rfqs',d.id);await patch('rfqs',d.id,{quotes:clone(r.quotes||[]).filter(q=>q.id!==d.q)});openRfq(d.id)}),
  cancelRfq:(d,b)=>arm(b,()=>run(async()=>{await patch('rfqs',d.id,{status:'cancelled'});closeDrawer();toast('اتلغى الطلب')})),
  settings:()=>settingsForm(),paste:()=>pasteForm(),
  requestAccess:()=>run(async()=>{if(!me.id)return;try{await put('requests',me.id,{ts:Date.now()})}catch(e){toast('الطلب اترفض. جرّب تاني، أو كلّم مدير النظام.','bad');S.requests=S.requests.filter(r=>r.id!==me.id);schedule();return}toast('اتبعت طلب الصلاحية')}),
  addRole:d=>run(async()=>{const s=document.querySelector(`[data-role-for="${CSS.escape(d.id)}"]`);const role=s?s.value:'viewer';await put('roles',d.id,{role},'تعيين دور: '+ROLES[role].t);if(byId('requests',d.id))await remove('requests',d.id);const box=$('#userRes');if(box){box.hidden=true;box.innerHTML=''}const inp=$('#userSearch');if(inp)inp.value='';toast(`اتحدد الدور: ${ROLES[role].t}`)}),
  copyReport:()=>copyText(reportText()),
  exportXlsx:(d,b)=>run(async()=>{
    const D=reportData();b.disabled=true;const t=b.textContent;b.textContent='بنجهّز الملف…';
    try{const X=await loadXLSX();const buf=X.write(buildWorkbook(X,D),{bookType:'xlsx',type:'array'});
      if(!downloadsNS){toast('تنزيل الملفات شغال في النسخة المنشورة بس','bad');return}
      try{await downloadsNS.save({filename:`تقرير الإدارة ${D.R[0]} - ${D.R[1]}.xlsx`,data:buf});toast('اتحفظ ملف Excel')}catch(e){toast(e&&e.code==='declined'?'اتلغى التنزيل':'التنزيل مش متاح هنا: '+((e&&e.message)||''),'bad')}
    }finally{b.disabled=false;b.textContent=t}
  }),
  dismissReq:d=>run(async()=>{await remove('requests',d.id);toast('اترفض الطلب')}),
  delRole:(d,b)=>arm(b,()=>run(async()=>{await remove('roles',d.id);toast('اتشالت الصلاحية')})),
  invite:d=>run(async()=>{const r=byId('rfqs',d.id);if(!r||!canWrite)return;const inv=Object.assign({},r.invited||{});inv[d.s]=today();await patch('rfqs',d.id,{invited:inv});if(!$('#drawer').hidden)openRfq(d.id)}),
  copyInvite:d=>{const r=byId('rfqs',d.id);if(!r)return;copyText(inviteMsg(r,d.s||''));if(d.s&&canWrite){const inv=Object.assign({},r.invited||{});inv[d.s]=today();run(()=>patch('rfqs',d.id,{invited:inv}))}},
  addPo:()=>poForm(),openPo:d=>openPo(d.id),editPo:d=>poForm(d.id),
  sendPo:d=>run(async()=>{const p=byId('pos',d.id);const tg=p.status==='approved'?{status:'sent',act:'إرسال للمورد'}:sendTarget(p,poValue(p));const act=tg.act;delete tg.act;await patch('pos',d.id,tg,act);if(!$('#drawer').hidden)openPo(d.id);toast(tg.status==='pending'?'اتبعت للإدارة تعتمده':'اتسجل إن الأمر اتبعت للمورد')}),
  approvePo:d=>run(async()=>{const p=byId('pos',d.id);await patch('pos',d.id,{status:'approved',approvedBy:me.id||'',approvedAt:Date.now(),approvedValue:poValue(p),rejectReason:''},'اعتماد');openPo(d.id);toast(`اتعتمد ${p.no}`)}),
  rejectPo:d=>run(async()=>{const r=($('#rejReason')||{}).value||'';if(!r.trim()){toast('اكتب سبب الرفض علشان المشتريات تعرف تعدّل إيه','bad');const el=$('#rejReason');if(el)el.focus();return}const p=byId('pos',d.id);await patch('pos',d.id,{status:'rejected',rejectReason:r.trim()},'رفض: '+r.trim());openPo(d.id);toast(`اترفض ${p.no}`)}),
  cancelPo:(d,b)=>arm(b,()=>run(async()=>{await patch('pos',d.id,{status:'cancelled'},'إلغاء');closeDrawer();toast('اتلغى أمر الشراء')})),
  receive:d=>grnForm(d.id),inspect:d=>inspectForm(d.id),
  grnNew:()=>grnForm(),openGrn:d=>openGrn(d.id),
  issueNew:d=>issueForm(d.id),openIssue:d=>openIssue(d.id),
  iretNew:d=>ireturnForm(d.id),openIret:d=>openIret(d.id),
  rretNew:d=>rreturnForm(d.id),openRret:d=>openRret(d.id),
  addShip:()=>shipForm(),editShip:d=>shipForm(d.id),shipNext:d=>run(async()=>{await shipNext(d.id);if(!$('#drawer').hidden)openShip(d.id)}),
  addLine:()=>{const w=$('#lines');w.insertAdjacentHTML('beforeend',lineRow({},{np:w.dataset.np==='1'}));if(w.closest('form.ship'))w.lastElementChild.querySelector('[name=li_price]').required=false},
  rmLine:(d,b)=>{const w=b.closest('.lines');if(w.children.length>1||w.dataset.optional==='1')b.closest('.line').remove()},
  del:(d,b)=>arm(b,()=>run(async()=>{await remove(d.col,d.id);closeDrawer();toast('اتحذف')})),
  clearSample:(d,b)=>arm(b,()=>run(async()=>{let n=0;for(const c of COLS)for(const x of S[c].filter(x=>x.sample===true)){await remove(c,x.id);n++}toast(`اتمسح ${n} سجل مثال`)}))
};
function arm(b,fn){if(b.dataset.armed){delete b.dataset.armed;fn();return}const t=b.textContent;b.dataset.armed='1';b.textContent='اضغط تاني للتأكيد';setTimeout(()=>{if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.textContent=t}},3500)}
// action -> module it belongs to; ':view' opens a record (read allowed if the module is visible)
const ACT_MOD={addSupplier:'suppliers',editSupplier:'suppliers:view',autoCodeSup:'suppliers',xlImportSup:'suppliers',xlImportItems:'inv',addWh:'wh',editWh:'wh:view',seedWh:'wh',addDept:'dept',editDept:'dept:view',seedDept:'dept',addItem:'inv',editItem:'inv:view',move:'inv',addRfq:'rfqs',rfqFromItem:'rfqs',openRfq:'rfqs:view',award:'rfqs',delQuote:'rfqs',cancelRfq:'rfqs',paste:'rfqs',invite:'rfqs',copyInvite:'rfqs',
  addPo:'pos',openPo:'pos:view',editPo:'pos',sendPo:'pos',cancelPo:'pos',approvePo:'approve',rejectPo:'approve',receive:'grn',grnNew:'grn',openGrn:'grn:view',inspect:'qa',issueNew:'issue',openIssue:'issue:view',
  iretNew:'iret',openIret:'iret:view',rretNew:'rret',openRret:'rret:view',addShip:'ship',editShip:'ship',shipNext:'ship',openShip:'ship:view',settings:'admin',clearSample:'admin',setRole:'admin',delRole:'admin',addRole:'admin',dismissReq:'admin',exportXlsx:'reports:view',copyReport:'reports:view'};
const COL_MOD={suppliers:'suppliers',items:'inv',pos:'pos',shipments:'ship',warehouses:'wh',depts:'dept'};
const actAllowed=(name,d)=>{let spec=name==='del'?COL_MOD[d.col]:ACT_MOD[name];if(!spec)return true;const[m,v]=spec.split(':');return v==='view'?(canSee(m)||canEditMod(m)):canEditMod(m)};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const name=b.dataset.a,a=ACT[name];if(!a)return;
  let spec=name==='del'?COL_MOD[b.dataset.col]:ACT_MOD[name];
  if(spec){const[m,v]=spec.split(':');
    if(v==='view'){if(!canSee(m)&&!canEditMod(m)){e.preventDefault();toast('الشاشة دي مش ضمن صلاحياتك','bad');return}drawerRO=!canEditMod(m)}
    else{if(!canEditMod(m)){e.preventDefault();toast('الإجراء ده مش ضمن صلاحياتك','bad');return}drawerRO=false}}
  if(b.tagName==='A'&&b.getAttribute('href')==='#')e.preventDefault();a(b.dataset,b,e)});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k==='q'){ui.q=e.target.value;schedule()}else if(k==='usearch')userSearch(e.target.value)});
document.addEventListener('change',e=>{const t=e.target;if(t.tagName==='SELECT'&&t.dataset.k&&t.closest('#view')){ui[t.dataset.k]=t.value;render()}});
document.addEventListener('focusin',e=>{if(e.target.id==='userSearch'&&!e.target.value)userSearch('')});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.roleFor||!t.closest('#view'))return;const id=t.dataset.roleFor;if(!S.roles.some(r=>r.id===id))return;if(!canEditMod('admin')){toast('مش ضمن صلاحياتك','bad');return}run(async()=>{await patch('roles',id,{role:t.value},'تغيير الدور إلى '+ROLES[t.value].t);toast('اتغيّر الدور')})});
document.addEventListener('change',e=>{const t=e.target;if(t.name!=='li_item'||t.closest('form.ship'))return;const row=t.closest('.line'),pin=row&&row.querySelector('[name=li_price]'),it=byId('items',t.value);if(pin&&it&&!pin.value)pin.value=it.cost||''});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#drawer').hidden)closeDrawer();else if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('article[data-a],tr[data-a][tabindex]')){e.preventDefault();e.target.click()}});

/* ---------- boot ---------- */
async function boot(){
  try{const h=location.hash.slice(1);if(VIEWS[h]){ui.view=h;ui.home=false}}catch(e){}
  if(matchMedia('(max-width:700px)').matches)Object.keys(KB).forEach(k=>ui.vm[k]='kanban');
  render();
  const c=window.claude;
  if(!c||typeof c.use!=='function'){mode='local';render();return}
  try{db=await c.use('db')}catch(e){db=null}
  if(!db){mode='local';render();return}
  mode='live';
  try{const u=await c.use('user');if(u){userNS=u;const[id,own,ed,w]=await Promise.all([u.id(),u.isOwner(),u.canEdit(),u.can('data.write')]);me={id,owner:own,editor:ed};if(w===false)canWrite=false}}catch(e){}
  c.use('downloads').then(d=>{downloadsNS=d}).catch(()=>{});
  COLS.forEach(col=>{db.collection(col).onSnapshot(snap=>{S[col]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));loaded.add(col);schedule()},err=>{loaded.add(col);schedule();toast('الاتصال بالبيانات وقف. اعمل ريفريش للصفحة.','bad')})});
  render();
}
boot();
</script>
